[package]
name = "mitdevcat"
version = "0.2.0"
edition = "2021"
authors = ["msierraltav <115440917+msierraltav@users.noreply.github.com>"]
description = "mitdevcat — static site rendered as a TUI grid and emitted as HTML"

[dependencies]
# No terminal, no crossterm, no wasm: only ratatui's layout/buffer engine.
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
